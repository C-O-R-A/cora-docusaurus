name: Deploy Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cora_docusaurus
        uses: actions/checkout@v4
        with:
          path: cora_docusaurus

      - name: Checkout cora_docs
        uses: actions/checkout@v4
        with:
          repository: C-O-R-A/cora_docs
          path: cora_docs
          # token: ${{ secrets.CORA_DOCS_PAT }}   # only needed if cora_docs is private

      - name: Install ROS 2 Jazzy
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base python3-rosdoc2 doxygen

      - name: Install Sphinx dependencies
        run: |
          pip install sphinx myst-parser sphinx-autodoc-typehints sphinxcontrib-autodoc-pydantic

      - name: Build Sphinx docs
        run: |
          source /opt/ros/jazzy/setup.bash
          cd cora_docs
          make html

      - name: Copy Sphinx output into Docusaurus static
        run: |
          rm -rf cora_docusaurus/static/api-sphinx
          cp -r cora_docs/_build/html cora_docusaurus/static/api-sphinx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cora_docusaurus/package-lock.json

      - name: Install Docusaurus dependencies
        run: |
          cd cora_docusaurus
          npm ci

      - name: Build Docusaurus
        run: |
          cd cora_docusaurus
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cora_docusaurus/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
